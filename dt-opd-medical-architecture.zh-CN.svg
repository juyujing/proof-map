<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" width="100%" role="img" aria-labelledby="t d" font-family="'Noto Sans SC','PingFang SC','Microsoft JhengHei','Heiti TC',sans-serif">
  <title id="t">DT-OPD 医学主线架构：双教师在线策略蒸馏（医疗伦理边界）</title>
  <desc id="d">学生 rollout 后，冻结的能力教师提供逐 token 分布，冻结的模型化边界教师独立作答并经拒答识别路由越界样本；能力损失与边界损失以 floor-PID λ 合并，只更新学生。推论只使用训练后学生。左栏列两条模型线的学生、教师与脱机 KD，右栏分列三类医学边界。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f4a5a"/></marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9f1d35"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f6e64"/></marker>
    <marker id="arI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b3f9e"/></marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1b2a41" flood-opacity="0.10"/></filter>
    <style>
      .h1{font-family:'Noto Serif TC','Songti TC','PMingLiU',serif;font-size:27px;font-weight:700;fill:#14213d}
      .sub{font-size:14px;fill:#5b6675}
      .ph{font-family:'Noto Serif TC','Songti TC','PMingLiU',serif;font-size:17px;font-weight:700;fill:#14213d;letter-spacing:.5px}
      .bt{font-size:15.5px;font-weight:700}
      .tx{font-size:13px;fill:#2c3542}
      .sm{font-size:12px;fill:#5b6675}
      .lb{font-size:13px;fill:#6b7684}
      .math{font-family:'Times New Roman','STIX Two Text',serif;font-style:italic;font-size:15px;fill:#1d2733}
      .chip{font-size:11.5px;font-weight:700}
      .al{font-size:12px;fill:#3f4a5a}
    </style>
  </defs>

  <rect width="1600" height="1010" fill="#fbfbfd"/>

  <!-- 标题 -->
  <text x="40" y="54" class="h1">DT-OPD 医学主线架构：双教师在线策略蒸馏</text>
  <text x="40" y="84" class="sub">医疗伦理边界（MedSafetyBench 协议）｜现行实作以实线、调度中组件以虚线标示｜数据截至 2026-11-26</text>
  <g transform="translate(1188,40)">
    <rect width="372" height="50" rx="8" fill="#ffffff" stroke="#d5dae2"/>
    <rect x="14" y="17" width="34" height="16" rx="3" fill="#ffffff" stroke="#3f4a5a" stroke-width="1.6"/>
    <text x="56" y="30" class="sm">现行实作</text>
    <rect x="126" y="17" width="34" height="16" rx="3" fill="#ffffff" stroke="#8a94a3" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="168" y="30" class="sm">调度／规划</text>
    <rect x="252" y="16" width="18" height="18" rx="3" fill="#e9f3f1" stroke="#0f6e64"/>
    <rect x="274" y="16" width="18" height="18" rx="3" fill="#fbecef" stroke="#9f1d35"/>
    <text x="300" y="30" class="sm">冻结教师</text>
  </g>

  <!-- ===== 左栏：模型与数据配置 ===== -->
  <rect x="30" y="110" width="400" height="650" rx="12" fill="#ffffff" stroke="#d5dae2" filter="url(#sh)"/>
  <text x="50" y="142" class="ph">模型与数据配置</text>
  <line x1="50" y1="152" x2="410" y2="152" stroke="#e3e7ed"/>

  <!-- A 线 -->
  <rect x="44" y="166" width="372" height="196" rx="9" fill="#f6f8fb" stroke="#d5dae2"/>
  <text x="58" y="191" class="bt" fill="#14213d">A 线｜文献复现（MedSafetyBench 原设置）</text>
  <rect x="58" y="201" width="104" height="21" rx="10.5" fill="#e3f2e8"/><text x="110" y="216" class="chip" fill="#17643a" text-anchor="middle">b1／dt 已实测</text>
  <text x="58" y="245" class="lb">学生</text><text x="132" y="245" class="tx">MedAlpaca-7B</text>
  <text x="58" y="268" class="lb">能力教师</text><text x="132" y="268" class="tx">Llama-2-70B-chat</text>
  <text x="58" y="291" class="lb">边界教师</text><text x="132" y="291" class="tx">MedAlpaca-7B＋MSB 安全微调</text>
  <text x="58" y="314" class="lb">脱机 KD</text><text x="132" y="314" class="tx">不使用（学生直接进入 OPD）</text>
  <rect x="54" y="326" width="352" height="27" rx="5" fill="none" stroke="#8a94a3" stroke-dasharray="5 3"/>
  <text x="62" y="344" class="sm">调度：能力教师换为未对齐的 Llama-2-70B 基座</text>

  <!-- B 线 -->
  <rect x="44" y="376" width="372" height="222" rx="9" fill="#f6f8fb" stroke="#d5dae2"/>
  <text x="58" y="401" class="bt" fill="#14213d">B 线｜统一现代模型（最终同场对比）</text>
  <rect x="58" y="411" width="148" height="21" rx="10.5" fill="#e4ecfb"/><text x="132" y="426" class="chip" fill="#1f4aa8" text-anchor="middle">b1 训练中・dt 调度</text>
  <text x="58" y="455" class="lb">学生</text><text x="132" y="455" class="tx">Qwen3.5-9B-Base</text>
  <text x="58" y="478" class="lb">能力教师</text><text x="132" y="478" class="tx">Qwen3.8-27B（b1 训练中）</text>
  <rect x="128" y="486" width="282" height="24" rx="5" fill="none" stroke="#8a94a3" stroke-dasharray="5 3"/>
  <text x="136" y="503" class="sm">Qwen3.5-35B-A3B-Base（未对齐，调度）</text>
  <text x="58" y="531" class="lb">边界教师</text><text x="132" y="531" class="tx">Qwen3.5-9B-Base＋MSB 安全微调</text>
  <text x="58" y="554" class="lb">脱机 KD</text><text x="132" y="554" class="tx">不使用</text>
  <text x="58" y="577" class="lb">文献方法</text><text x="132" y="577" class="tx">同一学生复现 SafeMed-R1（调度）</text>

  <!-- 共用评估 -->
  <rect x="44" y="612" width="372" height="136" rx="9" fill="#f6f8fb" stroke="#d5dae2"/>
  <text x="58" y="637" class="bt" fill="#14213d">共用评估协议</text>
  <text x="58" y="662" class="lb">有害度</text><text x="132" y="662" class="tx">MSB 测试集 900 题，1–5 分</text>
  <text x="132" y="681" class="sm">本机 Qwen3.8-27B 评审，越低越安全</text>
  <text x="58" y="704" class="lb">医学能力</text><text x="132" y="704" class="tx">MedQA／MedMCQA／PubMedQA／</text>
  <text x="132" y="723" class="tx">MMLU-Med，逐选项精确对数几率</text>
  <text x="58" y="742" class="lb">训练数据</text><text x="132" y="742" class="sm">MSB 有害请求 900＋医学选择题 900</text>

  <!-- ===== 中栏：训练流程 ===== -->
  <rect x="450" y="110" width="720" height="650" rx="12" fill="#ffffff" stroke="#d5dae2" filter="url(#sh)"/>
  <text x="470" y="142" class="ph">训练流程（每一步）</text>
  <line x1="470" y1="152" x2="1150" y2="152" stroke="#e3e7ed"/>

  <!-- ① 学生 rollout -->
  <rect x="620" y="166" width="380" height="80" rx="10" fill="#edf2f9" stroke="#1f3a5f" stroke-width="1.6"/>
  <text x="810" y="192" class="bt" fill="#1f3a5f" text-anchor="middle">① 学生 rollout</text>
  <text x="810" y="214" class="tx" text-anchor="middle">学生 <tspan class="math">π</tspan><tspan class="math" font-size="11" dy="3">θ</tspan><tspan dy="-3"> 对请求 </tspan><tspan class="math">x</tspan> 采样回答 <tspan class="math">y</tspan></text>
  <text x="810" y="234" class="sm" text-anchor="middle">不附边界回馈；之后所有评分均作用于原 rollout token</text>

  <!-- 分流 -->
  <path d="M810 246 V262 H625 V280" fill="none" stroke="#3f4a5a" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M810 262 H995 V280" fill="none" stroke="#3f4a5a" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="818" y="276" class="al">( <tspan class="math" font-size="13">x</tspan>, <tspan class="math" font-size="13">y</tspan> )</text>

  <!-- ② 能力教师 -->
  <rect x="470" y="284" width="310" height="104" rx="10" fill="#e9f3f1" stroke="#0f6e64" stroke-width="1.6"/>
  <text x="625" y="309" class="bt" fill="#0f6e64" text-anchor="middle">② 能力教师（冻结）</text>
  <text x="625" y="332" class="tx" text-anchor="middle">对 <tspan class="math">y</tspan> 每个位置给出下一 token 分布 <tspan class="math">q</tspan><tspan font-size="10" dy="3">cap</tspan></text>
  <text x="625" y="354" class="sm" text-anchor="middle">A 线 Llama-2-70B-chat｜B 线 Qwen3.8-27B</text>
  <text x="625" y="374" class="sm" text-anchor="middle">与学生共用词表，才能逐 token 对齐</text>

  <!-- ③ 边界教师 -->
  <rect x="840" y="284" width="310" height="104" rx="10" fill="#fbecef" stroke="#9f1d35" stroke-width="1.6"/>
  <text x="995" y="309" class="bt" fill="#9f1d35" text-anchor="middle">③ 边界教师（冻结・模型化）</text>
  <text x="995" y="332" class="tx" text-anchor="middle">学生同族模型＋MSB 安全微调</text>
  <text x="995" y="354" class="sm" text-anchor="middle">独立回答同一请求 <tspan class="math" font-size="13">x</tspan>，得到回答 <tspan class="math" font-size="13">b</tspan></text>
  <text x="995" y="374" class="sm" text-anchor="middle">拒答识别器读取 <tspan class="math" font-size="13">b</tspan> 与 <tspan class="math" font-size="13">y</tspan> 的决策</text>

  <path d="M625 388 V418" fill="none" stroke="#0f6e64" stroke-width="1.6" marker-end="url(#arG)"/>
  <text x="633" y="408" class="al"><tspan class="math" font-size="13">q</tspan><tspan font-size="9" dy="2">cap</tspan></text>
  <path d="M995 388 V418" fill="none" stroke="#9f1d35" stroke-width="1.6" marker-end="url(#arR)"/>
  <text x="1003" y="408" class="al">决策（<tspan class="math" font-size="13">b</tspan>, <tspan class="math" font-size="13">y</tspan>）</text>

  <!-- 能力损失 -->
  <rect x="470" y="422" width="310" height="104" rx="10" fill="#ffffff" stroke="#0f6e64" stroke-width="1.6"/>
  <text x="625" y="447" class="bt" fill="#0f6e64" text-anchor="middle">能力损失 <tspan class="math" font-size="16">L</tspan><tspan font-size="11" dy="3">C</tspan></text>
  <text x="625" y="470" class="tx" text-anchor="middle">½ forward KL＋½ reverse KL（对 <tspan class="math">q</tspan><tspan font-size="10" dy="3">cap</tspan><tspan dy="-3">）</tspan></text>
  <text x="625" y="492" class="sm" text-anchor="middle">合规样本的全部回答 token</text>
  <text x="625" y="512" class="sm" text-anchor="middle">越界样本由修正目标开关移出 <tspan class="math" font-size="13">L</tspan><tspan font-size="9" dy="2">C</tspan></text>

  <!-- ④ 审查／修复路由 -->
  <rect x="840" y="422" width="310" height="104" rx="10" fill="#fdf4e6" stroke="#a35a07" stroke-width="1.6"/>
  <text x="995" y="447" class="bt" fill="#a35a07" text-anchor="middle">④ 审查／修复路由</text>
  <text x="995" y="470" class="tx" text-anchor="middle">边界教师拒答 ∧ 学生未拒答 → 越界</text>
  <text x="995" y="492" class="sm" text-anchor="middle">越界：修正版 <tspan class="math" font-size="13">r</tspan> ＝ 边界教师回答 <tspan class="math" font-size="13">b</tspan></text>
  <text x="995" y="512" class="sm" text-anchor="middle">其余：合规，<tspan class="math" font-size="13">r</tspan> ＝ <tspan class="math" font-size="13">y</tspan>，不产生边界项</text>

  <!-- 合规 → L_C -->
  <path d="M840 474 H784" fill="none" stroke="#a35a07" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="811" y="466" class="al" text-anchor="middle">合规</text>
  <!-- 越界 → L_B -->
  <path d="M995 526 V556" fill="none" stroke="#9f1d35" stroke-width="1.6" marker-end="url(#arR)"/>
  <text x="1003" y="546" class="al" fill="#9f1d35">越界</text>

  <!-- 边界损失 -->
  <rect x="840" y="560" width="310" height="98" rx="10" fill="#ffffff" stroke="#9f1d35" stroke-width="1.6"/>
  <text x="995" y="584" class="bt" fill="#9f1d35" text-anchor="middle">边界损失 <tspan class="math" font-size="16">L</tspan><tspan font-size="11" dy="3">B</tspan><tspan dy="-3">（仅越界样本）</tspan></text>
  <text x="995" y="607" class="math" text-anchor="middle" font-size="14">δ = log p<tspan font-size="10" dy="3">B</tspan><tspan dy="-3">(y | 规则, r, x) − log p</tspan><tspan font-size="10" dy="3">B</tspan><tspan dy="-3">(y | x)</tspan></text>
  <text x="995" y="628" class="sm" text-anchor="middle">学生 top-k 期望、截断，依越界 token 占比缩放</text>
  <text x="995" y="647" class="sm" text-anchor="middle">＋修正版 <tspan class="math" font-size="13">r</tspan> 的 teacher-forced NLL</text>

  <!-- b1 对照臂 -->
  <rect x="470" y="560" width="270" height="76" rx="10" fill="#f3f4f7" stroke="#8a94a3" stroke-width="1.2"/>
  <text x="605" y="584" class="bt" fill="#4a5462" text-anchor="middle" font-size="14">b1 单教师对照臂</text>
  <text x="605" y="605" class="sm" text-anchor="middle">移除 ③④ 与 <tspan class="math" font-size="13">L</tspan><tspan font-size="9" dy="2">B</tspan></text>
  <text x="605" y="623" class="sm" text-anchor="middle">全部样本只算 <tspan class="math" font-size="13">L</tspan><tspan font-size="9" dy="2">C</tspan><tspan dy="-2">；同数据、同学生</tspan></text>

  <!-- L_C → 合并 -->
  <path d="M760 526 V680" fill="none" stroke="#0f6e64" stroke-width="1.6" marker-end="url(#arG)"/>
  <!-- L_B → 合并 -->
  <path d="M995 658 V680" fill="none" stroke="#9f1d35" stroke-width="1.6" marker-end="url(#arR)"/>

  <!-- ⑤ 合并与更新 -->
  <rect x="560" y="684" width="500" height="66" rx="10" fill="#eef0fb" stroke="#3b3f9e" stroke-width="1.6"/>
  <text x="810" y="707" class="bt" fill="#3b3f9e" text-anchor="middle">⑤ 合并与更新　<tspan class="math" font-size="16">L = L</tspan><tspan font-size="11" dy="3">C</tspan><tspan class="math" font-size="16" dy="-3"> + λ · L</tspan><tspan font-size="11" dy="3">B</tspan></text>
  <text x="810" y="727" class="sm" text-anchor="middle">λ 采 floor-PID：下限 1.0、越界率预算 5%，分母只计有害请求；本步使用更新前 λ</text>
  <text x="810" y="744" class="sm" text-anchor="middle">只更新学生；能力教师与边界教师保持冻结</text>

  <!-- 越界率 → λ -->
  <path d="M1150 474 H1162 V717 H1064" fill="none" stroke="#3b3f9e" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arI)"/>
  <text x="1166" y="600" class="al" fill="#3b3f9e" transform="rotate(90 1166 600)" text-anchor="middle" font-size="11">越界率 → λ</text>

  <!-- 循环：更新后学生 → 下一步 rollout -->
  <path d="M560 717 H460 V206 H616" fill="none" stroke="#1f3a5f" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="538" y="199" class="al" fill="#1f3a5f" text-anchor="middle">更新后 π<tspan font-size="9" dy="2">θ</tspan><tspan dy="-2"> 进入下一步</tspan></text>

  <!-- ===== 右栏：三类医学边界 ===== -->
  <rect x="1190" y="110" width="380" height="650" rx="12" fill="#ffffff" stroke="#d5dae2" filter="url(#sh)"/>
  <text x="1210" y="142" class="ph">三类医学边界（分开评估）</text>
  <line x1="1210" y1="152" x2="1550" y2="152" stroke="#e3e7ed"/>

  <!-- 1 医疗伦理 -->
  <rect x="1204" y="166" width="352" height="168" rx="9" fill="#fbecef" stroke="#9f1d35" stroke-width="1.6"/>
  <text x="1218" y="191" class="bt" fill="#9f1d35">1　医疗伦理｜MedSafetyBench</text>
  <rect x="1218" y="201" width="112" height="21" rx="10.5" fill="#9f1d35"/><text x="1274" y="216" class="chip" fill="#ffffff" text-anchor="middle">本图主线・实作</text>
  <text x="1218" y="245" class="tx">边界：违反 AMA 九条医学伦理原则的请求</text>
  <text x="1218" y="267" class="tx">边界教师：模型化（MSB 安全微调）</text>
  <text x="1218" y="289" class="tx">指标：有害度＋四项医学能力</text>
  <text x="1218" y="306" class="sm">A 线 b1／dt 已完成；B 线 b1 训练中、dt 调度</text>
  <text x="1218" y="324" class="sm">误拒（相近正当请求）评估尚未纳入</text>

  <!-- 2 密钥授权 -->
  <rect x="1204" y="348" width="352" height="196" rx="9" fill="#f6f8fb" stroke="#d5dae2"/>
  <text x="1218" y="373" class="bt" fill="#14213d">2　密钥授权｜SudoLM 固定密钥</text>
  <rect x="1218" y="383" width="132" height="21" rx="10.5" fill="#e3f2e8"/><text x="1284" y="398" class="chip" fill="#17643a" text-anchor="middle">300 步已完成・实测</text>
  <text x="1218" y="427" class="lb">学生</text><text x="1286" y="427" class="tx">Llama-3-8B-Instruct</text>
  <text x="1218" y="449" class="lb">能力教师</text><text x="1286" y="449" class="tx">Medical SFT（同基座）</text>
  <text x="1218" y="471" class="lb">边界</text><text x="1286" y="471" class="tx">访问规则程序（dt-repair）</text>
  <text x="1286" y="491" class="tx">或模型化边界（dt-learned）</text>
  <text x="1218" y="513" class="lb">脱机 KD</text><text x="1286" y="513" class="tx">不使用</text>
  <text x="1218" y="534" class="sm">访问控制对照，不宣称未见边界泛化</text>

  <!-- 3 病历隐私 -->
  <rect x="1204" y="558" width="352" height="190" rx="9" fill="#ffffff" stroke="#8a94a3" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="1218" y="583" class="bt" fill="#14213d">3　病历隐私｜Synthea 合成病历</text>
  <rect x="1218" y="593" width="156" height="21" rx="10.5" fill="#eceef2"/><text x="1296" y="608" class="chip" fill="#4a5462" text-anchor="middle">规划・数据已备未训练</text>
  <text x="1218" y="637" class="lb">学生</text><text x="1286" y="637" class="tx">Qwen3.5-2B</text>
  <text x="1218" y="659" class="lb">能力教师</text><text x="1286" y="659" class="tx">Qwen3.5-9B 经 MultiMedQA</text>
  <text x="1286" y="679" class="tx">＋Synthea 病历 SFT</text>
  <text x="1218" y="701" class="lb">审查者</text><text x="1286" y="701" class="tx">识别信息审查者，经他人病历调校</text>
  <text x="1218" y="723" class="lb">评分者</text><text x="1286" y="723" class="tx">干净 Qwen3.5-9B</text>
  <text x="1218" y="742" class="sm">秘密：构造的病历识别信息；1,145 位病人</text>

  <!-- ===== 下列：推论 ===== -->
  <rect x="30" y="780" width="700" height="132" rx="12" fill="#ffffff" stroke="#d5dae2" filter="url(#sh)"/>
  <text x="50" y="810" class="ph">⑥ 推论</text>
  <rect x="60" y="830" width="150" height="56" rx="9" fill="#f6f8fb" stroke="#3f4a5a" stroke-width="1.4"/>
