<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" width="100%" role="img" aria-labelledby="t d" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif">
  <title id="t">DT-OPD 醫學主線架構：雙教師在線策略蒸餾（醫療倫理邊界）</title>
  <desc id="d">學生 rollout 後，凍結的能力教師提供逐 token 分布，凍結的模型化邊界教師獨立作答並經拒答識別路由越界樣本；能力損失與邊界損失以 floor-PID λ 合併，只更新學生。推論只使用訓練後學生。左欄列兩條模型線的學生、教師與離線 KD，右欄分列三類醫學邊界。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f4a5a"/></marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9f1d35"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f6e64"/></marker>
    <marker id="arI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b3f9e"/></marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1b2a41" flood-opacity="0.10"/></filter>
    <style>
      .h1{font-family:'Noto Serif TC','Songti TC','PMingLiU',serif;font-size:27px;font-weight:700;fill:#14213d}
      .sub{font-size:14px;fill:#5b6675}
      .ph{font-family:'Noto Serif TC','Songti TC','PMingLiU',serif;font-size:17px;font-weight:700;fill:#14213d;letter-spacing:.5px}
      .bt{font-size:15.5px;font-weight:700}
      .tx{font-size:13px;fill:#2c3542}
      .sm{font-size:12px;fill:#5b6675}
      .lb{font-size:13px;fill:#6b7684}
      .math{font-family:'Times New Roman','STIX Two Text',serif;font-style:italic;font-size:15px;fill:#1d2733}
      .chip{font-size:11.5px;font-weight:700}
      .al{font-size:12px;fill:#3f4a5a}
    </style>
  </defs>

  <rect width="1600" height="1010" fill="#fbfbfd"/>

  <!-- 標題 -->
  <text x="40" y="54" class="h1">DT-OPD 醫學主線架構：雙教師在線策略蒸餾</text>
  <text x="40" y="84" class="sub">醫療倫理邊界（MedSafetyBench 協議）｜現行實作以實線、排程中組件以虛線標示｜資料截至 2026-11-26</text>
  <g transform="translate(1188,40)">
    <rect width="372" height="50" rx="8" fill="#ffffff" stroke="#d5dae2"/>
    <rect x="14" y="17" width="34" height="16" rx="3" fill="#ffffff" stroke="#3f4a5a" stroke-width="1.6"/>
    <text x="56" y="30" class="sm">現行實作</text>
    <rect x="126" y="17" width="34" height="16" rx="3" fill="#ffffff" stroke="#8a94a3" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="168" y="30" class="sm">排程／規劃</text>
    <rect x="252" y="16" width="18" height="18" rx="3" fill="#e9f3f1" stroke="#0f6e64"/>
    <rect x="274" y="16" width="18" height="18" rx="3" fill="#fbecef" stroke="#9f1d35"/>
    <text x="300" y="30" class="sm">凍結教師</text>
  </g>

  <!-- ===== 左欄：模型與資料配置 ===== -->
  <rect x="30" y="110" width="400" height="650" rx="12" fill="#ffffff" stroke="#d5dae2" filter="url(#sh)"/>
  <text x="50" y="142" class="ph">模型與資料配置</text>
  <line x1="50" y1="152" x2="410" y2="152" stroke="#e3e7ed"/>

  <!-- A 線 -->
  <rect x="44" y="166" width="372" height="196" rx="9" fill="#f6f8fb" stroke="#d5dae2"/>
  <text x="58" y="191" class="bt" fill="#14213d">A 線｜文獻復現（MedSafetyBench 原設定）</text>
  <rect x="58" y="201" width="104" height="21" rx="10.5" fill="#e3f2e8"/><text x="110" y="216" class="chip" fill="#17643a" text-anchor="middle">b1／dt 已實測</text>
  <text x="58" y="245" class="lb">學生</text><text x="132" y="245" class="tx">MedAlpaca-7B</text>
  <text x="58" y="268" class="lb">能力教師</text><text x="132" y="268" class="tx">Llama-2-70B-chat</text>
  <text x="58" y="291" class="lb">邊界教師</text><text x="132" y="291" class="tx">MedAlpaca-7B＋MSB 安全微調</text>
  <text x="58" y="314" class="lb">離線 KD</text><text x="132" y="314" class="tx">不使用（學生直接進入 OPD）</text>
  <rect x="54" y="326" width="352" height="27" rx="5" fill="none" stroke="#8a94a3" stroke-dasharray="5 3"/>
  <text x="62" y="344" class="sm">排程：能力教師換為未對齊的 Llama-2-70B 基座</text>

  <!-- B 線 -->
  <rect x="44" y="376" width="372" height="222" rx="9" fill="#f6f8fb" stroke="#d5dae2"/>
  <text x="58" y="401" class="bt" fill="#14213d">B 線｜統一現代模型（最終同場對比）</text>
  <rect x="58" y="411" width="148" height="21" rx="10.5" fill="#e4ecfb"/><text x="132" y="426" class="chip" fill="#1f4aa8" text-anchor="middle">b1 訓練中・dt 排程</text>
  <text x="58" y="455" class="lb">學生</text><text x="132" y="455" class="tx">Qwen3.5-9B-Base</text>
  <text x="58" y="478" class="lb">能力教師</text><text x="132" y="478" class="tx">Qwen3.8-27B（b1 訓練中）</text>
  <rect x="128" y="486" width="282" height="24" rx="5" fill="none" stroke="#8a94a3" stroke-dasharray="5 3"/>
  <text x="136" y="503" class="sm">Qwen3.5-35B-A3B-Base（未對齊，排程）</text>
  <text x="58" y="531" class="lb">邊界教師</text><text x="132" y="531" class="tx">Qwen3.5-9B-Base＋MSB 安全微調</text>
  <text x="58" y="554" class="lb">離線 KD</text><text x="132" y="554" class="tx">不使用</text>
  <text x="58" y="577" class="lb">文獻方法</text><text x="132" y="577" class="tx">同一學生復現 SafeMed-R1（排程）</text>

  <!-- 共用評估 -->
  <rect x="44" y="612" width="372" height="136" rx="9" fill="#f6f8fb" stroke="#d5dae2"/>
  <text x="58" y="637" class="bt" fill="#14213d">共用評估協議</text>
  <text x="58" y="662" class="lb">有害度</text><text x="132" y="662" class="tx">MSB 測試集 900 題，1–5 分</text>
  <text x="132" y="681" class="sm">本機 Qwen3.8-27B 評審，越低越安全</text>
  <text x="58" y="704" class="lb">醫學能力</text><text x="132" y="704" class="tx">MedQA／MedMCQA／PubMedQA／</text>
  <text x="132" y="723" class="tx">MMLU-Med，逐選項精確對數機率</text>
  <text x="58" y="742" class="lb">訓練資料</text><text x="132" y="742" class="sm">MSB 有害請求 900＋醫學選擇題 900</text>

  <!-- ===== 中欄：訓練流程 ===== -->
  <rect x="450" y="110" width="720" height="650" rx="12" fill="#ffffff" stroke="#d5dae2" filter="url(#sh)"/>
  <text x="470" y="142" class="ph">訓練流程（每一步）</text>
  <line x1="470" y1="152" x2="1150" y2="152" stroke="#e3e7ed"/>

  <!-- ① 學生 rollout -->
  <rect x="620" y="166" width="380" height="80" rx="10" fill="#edf2f9" stroke="#1f3a5f" stroke-width="1.6"/>
  <text x="810" y="192" class="bt" fill="#1f3a5f" text-anchor="middle">① 學生 rollout</text>
  <text x="810" y="214" class="tx" text-anchor="middle">學生 <tspan class="math">π</tspan><tspan class="math" font-size="11" dy="3">θ</tspan><tspan dy="-3"> 對請求 </tspan><tspan class="math">x</tspan> 取樣回答 <tspan class="math">y</tspan></text>
  <text x="810" y="234" class="sm" text-anchor="middle">不附邊界回饋；之後所有評分均作用於原 rollout token</text>

  <!-- 分流 -->
  <path d="M810 246 V262 H625 V280" fill="none" stroke="#3f4a5a" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M810 262 H995 V280" fill="none" stroke="#3f4a5a" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="818" y="276" class="al">( <tspan class="math" font-size="13">x</tspan>, <tspan class="math" font-size="13">y</tspan> )</text>

  <!-- ② 能力教師 -->
  <rect x="470" y="284" width="310" height="104" rx="10" fill="#e9f3f1" stroke="#0f6e64" stroke-width="1.6"/>
  <text x="625" y="309" class="bt" fill="#0f6e64" text-anchor="middle">② 能力教師（凍結）</text>
  <text x="625" y="332" class="tx" text-anchor="middle">對 <tspan class="math">y</tspan> 每個位置給出下一 token 分布 <tspan class="math">q</tspan><tspan font-size="10" dy="3">cap</tspan></text>
  <text x="625" y="354" class="sm" text-anchor="middle">A 線 Llama-2-70B-chat｜B 線 Qwen3.8-27B</text>
  <text x="625" y="374" class="sm" text-anchor="middle">與學生共用詞表，才能逐 token 對齊</text>

  <!-- ③ 邊界教師 -->
  <rect x="840" y="284" width="310" height="104" rx="10" fill="#fbecef" stroke="#9f1d35" stroke-width="1.6"/>
  <text x="995" y="309" class="bt" fill="#9f1d35" text-anchor="middle">③ 邊界教師（凍結・模型化）</text>
  <text x="995" y="332" class="tx" text-anchor="middle">學生同族模型＋MSB 安全微調</text>
  <text x="995" y="354" class="sm" text-anchor="middle">獨立回答同一請求 <tspan class="math" font-size="13">x</tspan>，得到回答 <tspan class="math" font-size="13">b</tspan></text>
  <text x="995" y="374" class="sm" text-anchor="middle">拒答識別器讀取 <tspan class="math" font-size="13">b</tspan> 與 <tspan class="math" font-size="13">y</tspan> 的決策</text>

  <path d="M625 388 V418" fill="none" stroke="#0f6e64" stroke-width="1.6" marker-end="url(#arG)"/>
  <text x="633" y="408" class="al"><tspan class="math" font-size="13">q</tspan><tspan font-size="9" dy="2">cap</tspan></text>
  <path d="M995 388 V418" fill="none" stroke="#9f1d35" stroke-width="1.6" marker-end="url(#arR)"/>
  <text x="1003" y="408" class="al">決策（<tspan class="math" font-size="13">b</tspan>, <tspan class="math" font-size="13">y</tspan>）</text>

  <!-- 能力損失 -->
  <rect x="470" y="422" width="310" height="104" rx="10" fill="#ffffff" stroke="#0f6e64" stroke-width="1.6"/>
  <text x="625" y="447" class="bt" fill="#0f6e64" text-anchor="middle">能力損失 <tspan class="math" font-size="16">L</tspan><tspan font-size="11" dy="3">C</tspan></text>
  <text x="625" y="470" class="tx" text-anchor="middle">½ forward KL＋½ reverse KL（對 <tspan class="math">q</tspan><tspan font-size="10" dy="3">cap</tspan><tspan dy="-3">）</tspan></text>
  <text x="625" y="492" class="sm" text-anchor="middle">合規樣本的全部回答 token</text>
  <text x="625" y="512" class="sm" text-anchor="middle">越界樣本由修正目標開關移出 <tspan class="math" font-size="13">L</tspan><tspan font-size="9" dy="2">C</tspan></text>

  <!-- ④ 審查／修復路由 -->
  <rect x="840" y="422" width="310" height="104" rx="10" fill="#fdf4e6" stroke="#a35a07" stroke-width="1.6"/>
  <text x="995" y="447" class="bt" fill="#a35a07" text-anchor="middle">④ 審查／修復路由</text>
  <text x="995" y="470" class="tx" text-anchor="middle">邊界教師拒答 ∧ 學生未拒答 → 越界</text>
  <text x="995" y="492" class="sm" text-anchor="middle">越界：修正版 <tspan class="math" font-size="13">r</tspan> ＝ 邊界教師回答 <tspan class="math" font-size="13">b</tspan></text>
  <text x="995" y="512" class="sm" text-anchor="middle">其餘：合規，<tspan class="math" font-size="13">r</tspan> ＝ <tspan class="math" font-size="13">y</tspan>，不產生邊界項</text>

  <!-- 合規 → L_C -->
  <path d="M840 474 H784" fill="none" stroke="#a35a07" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="811" y="466" class="al" text-anchor="middle">合規</text>
  <!-- 越界 → L_B -->
  <path d="M995 526 V556" fill="none" stroke="#9f1d35" stroke-width="1.6" marker-end="url(#arR)"/>
  <text x="1003" y="546" class="al" fill="#9f1d35">越界</text>

  <!-- 邊界損失 -->
  <rect x="840" y="560" width="310" height="98" rx="10" fill="#ffffff" stroke="#9f1d35" stroke-width="1.6"/>
  <text x="995" y="584" class="bt" fill="#9f1d35" text-anchor="middle">邊界損失 <tspan class="math" font-size="16">L</tspan><tspan font-size="11" dy="3">B</tspan><tspan dy="-3">（僅越界樣本）</tspan></text>
  <text x="995" y="607" class="math" text-anchor="middle" font-size="14">δ = log p<tspan font-size="10" dy="3">B</tspan><tspan dy="-3">(y | 規則, r, x) − log p</tspan><tspan font-size="10" dy="3">B</tspan><tspan dy="-3">(y | x)</tspan></text>
  <text x="995" y="628" class="sm" text-anchor="middle">學生 top-k 期望、截斷，依越界 token 占比縮放</text>
  <text x="995" y="647" class="sm" text-anchor="middle">＋修正版 <tspan class="math" font-size="13">r</tspan> 的 teacher-forced NLL</text>

  <!-- b1 對照臂 -->
  <rect x="470" y="560" width="270" height="76" rx="10" fill="#f3f4f7" stroke="#8a94a3" stroke-width="1.2"/>
  <text x="605" y="584" class="bt" fill="#4a5462" text-anchor="middle" font-size="14">b1 單教師對照臂</text>
  <text x="605" y="605" class="sm" text-anchor="middle">移除 ③④ 與 <tspan class="math" font-size="13">L</tspan><tspan font-size="9" dy="2">B</tspan></text>
  <text x="605" y="623" class="sm" text-anchor="middle">全部樣本只算 <tspan class="math" font-size="13">L</tspan><tspan font-size="9" dy="2">C</tspan><tspan dy="-2">；同資料、同學生</tspan></text>

  <!-- L_C → 合併 -->
  <path d="M760 526 V680" fill="none" stroke="#0f6e64" stroke-width="1.6" marker-end="url(#arG)"/>
  <!-- L_B → 合併 -->
  <path d="M995 658 V680" fill="none" stroke="#9f1d35" stroke-width="1.6" marker-end="url(#arR)"/>

  <!-- ⑤ 合併與更新 -->
  <rect x="560" y="684" width="500" height="66" rx="10" fill="#eef0fb" stroke="#3b3f9e" stroke-width="1.6"/>
  <text x="810" y="707" class="bt" fill="#3b3f9e" text-anchor="middle">⑤ 合併與更新　<tspan class="math" font-size="16">L = L</tspan><tspan font-size="11" dy="3">C</tspan><tspan class="math" font-size="16" dy="-3"> + λ · L</tspan><tspan font-size="11" dy="3">B</tspan></text>
  <text x="810" y="727" class="sm" text-anchor="middle">λ 採 floor-PID：下限 1.0、越界率預算 5%，分母只計有害請求；本步使用更新前 λ</text>
  <text x="810" y="744" class="sm" text-anchor="middle">只更新學生；能力教師與邊界教師保持凍結</text>

  <!-- 越界率 → λ -->
  <path d="M1150 474 H1162 V717 H1064" fill="none" stroke="#3b3f9e" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arI)"/>
  <text x="1166" y="600" class="al" fill="#3b3f9e" transform="rotate(90 1166 600)" text-anchor="middle" font-size="11">越界率 → λ</text>

  <!-- 迴圈：更新後學生 → 下一步 rollout -->
  <path d="M560 717 H460 V206 H616" fill="none" stroke="#1f3a5f" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="538" y="199" class="al" fill="#1f3a5f" text-anchor="middle">更新後 π<tspan font-size="9" dy="2">θ</tspan><tspan dy="-2"> 進入下一步</tspan></text>

  <!-- ===== 右欄：三類醫學邊界 ===== -->
  <rect x="1190" y="110" width="380" height="650" rx="12" fill="#ffffff" stroke="#d5dae2" filter="url(#sh)"/>
  <text x="1210" y="142" class="ph">三類醫學邊界（分開評估）</text>
  <line x1="1210" y1="152" x2="1550" y2="152" stroke="#e3e7ed"/>

  <!-- 1 醫療倫理 -->
  <rect x="1204" y="166" width="352" height="168" rx="9" fill="#fbecef" stroke="#9f1d35" stroke-width="1.6"/>
  <text x="1218" y="191" class="bt" fill="#9f1d35">1　醫療倫理｜MedSafetyBench</text>
  <rect x="1218" y="201" width="112" height="21" rx="10.5" fill="#9f1d35"/><text x="1274" y="216" class="chip" fill="#ffffff" text-anchor="middle">本圖主線・實作</text>
  <text x="1218" y="245" class="tx">邊界：違反 AMA 九條醫學倫理原則的請求</text>
  <text x="1218" y="267" class="tx">邊界教師：模型化（MSB 安全微調）</text>
  <text x="1218" y="289" class="tx">指標：有害度＋四項醫學能力</text>
  <text x="1218" y="306" class="sm">A 線 b1／dt 已完成；B 線 b1 訓練中、dt 排程</text>
  <text x="1218" y="324" class="sm">誤拒（相近正當請求）評估尚未納入</text>

  <!-- 2 金鑰授權 -->
  <rect x="1204" y="348" width="352" height="196" rx="9" fill="#f6f8fb" stroke="#d5dae2"/>
  <text x="1218" y="373" class="bt" fill="#14213d">2　金鑰授權｜SudoLM 固定金鑰</text>
  <rect x="1218" y="383" width="132" height="21" rx="10.5" fill="#e3f2e8"/><text x="1284" y="398" class="chip" fill="#17643a" text-anchor="middle">300 步已完成・實測</text>
  <text x="1218" y="427" class="lb">學生</text><text x="1286" y="427" class="tx">Llama-3-8B-Instruct</text>
  <text x="1218" y="449" class="lb">能力教師</text><text x="1286" y="449" class="tx">Medical SFT（同基座）</text>
  <text x="1218" y="471" class="lb">邊界</text><text x="1286" y="471" class="tx">存取規則程式（dt-repair）</text>
  <text x="1286" y="491" class="tx">或模型化邊界（dt-learned）</text>
  <text x="1218" y="513" class="lb">離線 KD</text><text x="1286" y="513" class="tx">不使用</text>
  <text x="1218" y="534" class="sm">存取控制對照，不宣稱未見邊界泛化</text>

  <!-- 3 病歷隱私 -->
  <rect x="1204" y="558" width="352" height="190" rx="9" fill="#ffffff" stroke="#8a94a3" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="1218" y="583" class="bt" fill="#14213d">3　病歷隱私｜Synthea 合成病歷</text>
  <rect x="1218" y="593" width="156" height="21" rx="10.5" fill="#eceef2"/><text x="1296" y="608" class="chip" fill="#4a5462" text-anchor="middle">規劃・資料已備未訓練</text>
  <text x="1218" y="637" class="lb">學生</text><text x="1286" y="637" class="tx">Qwen3.5-2B</text>
  <text x="1218" y="659" class="lb">能力教師</text><text x="1286" y="659" class="tx">Qwen3.5-9B 經 MultiMedQA</text>
  <text x="1286" y="679" class="tx">＋Synthea 病歷 SFT</text>
  <text x="1218" y="701" class="lb">審查者</text><text x="1286" y="701" class="tx">識別資訊審查者，經他人病歷調校</text>
  <text x="1218" y="723" class="lb">評分者</text><text x="1286" y="723" class="tx">乾淨 Qwen3.5-9B</text>
  <text x="1218" y="742" class="sm">秘密：構造的病歷識別資訊；1,145 位病人</text>

  <!-- ===== 下列：推論 ===== -->
